name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # necessário para Cosign keyless (OIDC)

jobs:
  test-go:
    name: Test Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go test ./...

  test-java:
    name: Test Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build e testes Java
        run: mvn -f assinador/pom.xml verify -q

  build:
    name: Build & Checksum
    runs-on: ubuntu-latest
    needs: [test-go, test-java]
    outputs:
      version: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build binários Go
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          LDFLAGS_ASSINATURA="-X github.com/kyriosdata/runner/cmd/assinatura/cmd.version=${VERSION}"
          LDFLAGS_SIMULADOR="-X github.com/kyriosdata/runner/cmd/simulador/cmd.version=${VERSION}"

          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS_ASSINATURA}" -o dist/assinatura-${VERSION}-linux-amd64   ./cmd/assinatura
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS_ASSINATURA}" -o dist/assinatura-${VERSION}-windows-amd64.exe ./cmd/assinatura
          GOOS=darwin  GOARCH=amd64 go build -ldflags "${LDFLAGS_ASSINATURA}" -o dist/assinatura-${VERSION}-darwin-amd64  ./cmd/assinatura

          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS_SIMULADOR}" -o dist/simulador-${VERSION}-linux-amd64   ./cmd/simulador
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS_SIMULADOR}" -o dist/simulador-${VERSION}-windows-amd64.exe ./cmd/simulador
          GOOS=darwin  GOARCH=amd64 go build -ldflags "${LDFLAGS_SIMULADOR}" -o dist/simulador-${VERSION}-darwin-amd64  ./cmd/simulador

      - name: Build assinador.jar
        run: |
          mvn -f assinador/pom.xml package -DskipTests -q
          cp assinador/target/assinador.jar dist/assinador.jar

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts with Cosign (keyless)
        working-directory: dist
        run: |
          for f in $(ls | grep -v checksums.txt); do
            cosign sign-blob \
              --yes \
              --output-certificate "${f}.pem" \
              --output-signature  "${f}.sig" \
              "${f}"
          done

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## ${{ needs.build.outputs.version }}

            ### Downloads
            Baixe o binário para sua plataforma e verifique a integridade com `checksums.txt`.

            ### Verificar autenticidade (Cosign)
            ```bash
            cosign verify-blob \
              --certificate <arquivo>.pem \
              --signature   <arquivo>.sig \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              <arquivo>
            ```
