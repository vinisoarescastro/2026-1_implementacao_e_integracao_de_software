name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Test Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  test-java:
    name: Test Java
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build e testes Java
        run: mvn -f assinador/pom.xml verify -q

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: [test-go, test-java]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build assinatura — Linux
        run: GOOS=linux GOARCH=amd64 go build -o dist/assinatura-linux-amd64 ./cmd/assinatura

      - name: Build assinatura — Windows
        run: GOOS=windows GOARCH=amd64 go build -o dist/assinatura-windows-amd64.exe ./cmd/assinatura

      - name: Build assinatura — macOS
        run: GOOS=darwin GOARCH=amd64 go build -o dist/assinatura-darwin-amd64 ./cmd/assinatura

      - name: Build simulador — Linux
        run: GOOS=linux GOARCH=amd64 go build -o dist/simulador-linux-amd64 ./cmd/simulador

      - name: Build simulador — Windows
        run: GOOS=windows GOARCH=amd64 go build -o dist/simulador-windows-amd64.exe ./cmd/simulador

      - name: Build simulador — macOS
        run: GOOS=darwin GOARCH=amd64 go build -o dist/simulador-darwin-amd64 ./cmd/simulador

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
